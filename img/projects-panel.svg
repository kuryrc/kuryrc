<text x="30" y="100" fill="#79c0ff" font-size="20">01 / omarchy-lyricify</text><text x="930" y="100" text-anchor="end" fill="#7ee787" font-size="14">QML / stars 0</text><text x="30" y="134" fill="#8b949e">A lyrics island for Omarchy / Hyprland, with timed lyrics and playback controls for Spotify</text><text x="30" y="157" fill="#8b949e">and MPRIS players.</text><path d="M30 185h900" stroke="#21262d"/><text x="30" y="210" fill="#79c0ff" font-size="20">02 / omarchy-mfa</text><text x="930" y="210" text-anchor="end" fill="#7ee787" font-size="14">Python / stars 1</text><text x="30" y="244" fill="#8b949e">A native, keyboard-driven TOTP plugin with system keyring storage.</text><path d="M30 272h900" stroke="#21262d"/><text x="30" y="297" fill="#79c0ff" font-size="20">03 / raycast-plugins</text><text x="930" y="297" text-anchor="end" fill="#7ee787" font-size="14">TypeScript / stars 0</text><text x="30" y="331" fill="#8b949e">Explore the source and documentation.</text><path d="M30 359h900" stroke="#21262d"/><text x="30" y="384" fill="#79c0ff" font-size="20">04 / pfwd</text><text x="930" y="384" text-anchor="end" fill="#7ee787" font-size="14">Rust / stars 2</text><text x="30" y="418" fill="#8b949e">pfwd is a single Rust binary that supervises configurable port-forwarding tasks, bridging host</text><text x="30" y="441" fill="#8b949e">TCP listeners to namespace-scoped services through managed Unix sockets for OpenStack-style</text><text x="30" y="464" fill="#8b949e">environments.</text><path d="M30 492h900" stroke="#21262d"/><text x="30" y="517" fill="#79c0ff" font-size="20">05 / fs-bench-rs</text><text x="930" y="517" text-anchor="end" fill="#7ee787" font-size="14">Rust / stars 0</text><text x="30" y="551" fill="#8b949e">Filesystem benchmarking and integrity checking in Rust.</text></g></svg>